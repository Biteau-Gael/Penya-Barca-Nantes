services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=penya_barca_nantes
      - POSTGRES_USER=penya
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penya -d penya_barca_nantes"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?Définir REDIS_PASSWORD dans .env}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build-env
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: npx drizzle-kit push --config=drizzle.config.ts
    profiles:
      - tools

volumes:
  pgdata:
